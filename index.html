<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Games</title>
<meta name="description" content="Piccoli giochi gratuiti da browser con una sfida nuova ogni giorno. Senza account, senza installare nulla.">
<meta name="theme-color" content="#1b1c1f">
<meta property="og:title" content="Daily Games">
<meta property="og:description" content="Piccoli giochi gratuiti da browser con una sfida nuova ogni giorno.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg">
<!-- AdSense: quando il sito sarà approvato, lo script di verifica va qui, prima di </head> -->
<style>
@font-face{ font-family:"Bricolage"; src:url("fonts/Bricolage.woff2") format("woff2"); font-weight:200 800; font-style:normal; font-display:swap; }
:root{
  --bg:#1b1c1f; --surface:#242629; --surface-2:#2c2e33; --line:#35383e;
  --fg:#f2f1ed; --muted:#9d9fa5; --faint:#5e6167;
  --font:"Bricolage","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-weight:400; font-size:17px; line-height:1.5}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--fg); outline-offset:3px}
.wrap{max-width:760px; margin:0 auto; padding:0 20px 48px}

/* header */
.top{display:flex; justify-content:space-between; align-items:center; padding:18px 0 0; gap:12px}
.brand{font-weight:800; font-size:20px; letter-spacing:-.01em; text-decoration:none; display:flex; align-items:center; gap:10px}
.brand i{width:26px; height:26px; border-radius:7px; background:var(--fg); display:inline-grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:5px}
.brand i b{background:var(--bg); border-radius:50%}
.lang{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.lang button{border:0; background:transparent; color:var(--muted); font-family:inherit; font-weight:600; font-size:13px; letter-spacing:.06em; padding:6px 11px; cursor:pointer}
.lang button + button{border-left:1px solid var(--line)}
.lang button.on{background:var(--fg); color:var(--bg)}

/* hero */
.hero{padding:54px 0 34px}
.hero h1{margin:0 0 12px; font-size:clamp(40px,9vw,64px); font-weight:800; line-height:.98; letter-spacing:-.025em}
.hero p{margin:0; font-size:19px; color:var(--muted); max-width:34em}
.today{margin-top:22px; display:inline-flex; align-items:center; gap:10px; font-weight:600; font-size:14px; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 14px 7px 10px}
.today i{width:8px; height:8px; border-radius:50%; background:var(--fg); opacity:.9}

/* games */
.games{display:flex; flex-direction:column; gap:14px; margin-top:8px}
.card{--accent:#f2f1ed; display:grid; grid-template-columns:1fr; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; text-decoration:none; color:inherit; transition:border-color .12s}
.card:hover{border-color:var(--faint)}
.card .art{background:var(--surface-2); min-height:150px; display:flex; align-items:center; justify-content:center; position:relative}
.card .art img{width:100%; height:100%; max-height:190px; object-fit:cover; display:block}
.card .art .mono{width:88px; height:88px; border-radius:20px; background:var(--accent); color:var(--accent-fg,#111); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:34px; letter-spacing:-.03em}
.card .body{padding:18px 20px 20px}
.card h2{margin:0 0 6px; font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.1; display:flex; align-items:center; gap:10px}
.card h2 i{width:10px; height:10px; border-radius:50%; background:var(--accent); flex:0 0 auto}
.card p{margin:0 0 12px; color:var(--muted); font-size:16px}
.meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px}
.meta span{font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--muted); border:1px solid var(--line); padding:3px 8px; border-radius:6px}
.play{display:inline-block; background:var(--accent); color:var(--accent-fg,#111); font-weight:700; font-size:16px; padding:11px 20px; border-radius:10px}
@media (min-width:600px){ .card{grid-template-columns:240px 1fr} .card .art{min-height:100%} .card .art img{max-height:none; height:100%} }

/* states */
.skeleton{height:170px; border-radius:16px; background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface)); background-size:200% 100%; animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skeleton{animation:none}}
.note{color:var(--muted); font-size:15px; margin:10px 0 0}
.soon{margin:18px 0 0; color:var(--faint); font-size:15px}

/* footer */
footer{margin-top:52px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; display:flex; flex-wrap:wrap; gap:8px 22px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="./"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i>Daily Games</a>
    <div class="lang" role="group" aria-label="Lingua / Language">
      <button data-lang="it" class="on">IT</button><button data-lang="en">EN</button>
    </div>
  </div>

  <section class="hero">
    <h1 data-t="title"></h1>
    <p data-t="sub"></p>
    <div class="today"><i></i><span id="today"></span></div>
  </section>

  <div class="games" id="games"><div class="skeleton"></div></div>
  <p class="soon" data-t="soon"></p>

  <footer>
    <a href="privacy.html" data-t="privacy"></a>
    <a href="https://github.com/dailygames-hub" data-t="source"></a>
    <span data-t="by"></span>
  </footer>
</div>

<script>
const T = {
  it: { title:"Un gioco nuovo ogni giorno.", sub:"Piccoli giochi da browser, gratuiti, senza account e senza installare nulla. La sfida del giorno è la stessa per tutti.",
        todayPrefix:"Sfide di oggi, ", play:"Gioca", daily:"OGNI GIORNO", soon:"Altri giochi in arrivo.",
        loadFail:"L'elenco dei giochi non è disponibile in questo momento.", empty:"Nessun gioco pubblicato ancora.",
        privacy:"Privacy", source:"Codice su GitHub", by:"Un progetto di Luca Zanotto", locale:"it-IT" },
  en: { title:"A new game every day.", sub:"Small browser games, free, no account and nothing to install. Today's challenge is the same for everyone.",
        todayPrefix:"Today's challenges, ", play:"Play", daily:"DAILY", soon:"More games coming.",
        loadFail:"The game list is not available right now.", empty:"No games published yet.",
        privacy:"Privacy", source:"Source on GitHub", by:"A project by Luca Zanotto", locale:"en-GB" }
};
let lang = "it"; try { lang = localStorage.getItem("hub:lang") || lang; } catch(e){}
if (!T[lang]) lang = "it";
let games = null;

function txt(v){ if (v == null) return ""; if (typeof v === "string") return v; return v[lang] || v.it || v.en || Object.values(v)[0] || ""; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function safeUrl(u){ return /^(https:\/\/[\w.\-\/%?=&]+|data:image\/(svg\+xml|png|jpeg|webp)[;,][^"'<>]*|[\w.\-\/]+)$/.test(u) ? u : ""; }
function fgFor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "#111";
  const n = parseInt(m[1], 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (0.2126*r + 0.7152*g + 0.0722*b) > 150 ? "#111" : "#fff";
}
function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[lang][el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  const ds = new Date().toLocaleDateString(T[lang].locale, { weekday:"long", day:"numeric", month:"long" });
  document.getElementById("today").textContent = T[lang].todayPrefix + ds;
  const box = document.getElementById("games");
  if (games === null) return;
  if (games === false){ box.innerHTML = `<p class="note">${T[lang].loadFail}</p>`; return; }
  if (!games.length){ box.innerHTML = `<p class="note">${T[lang].empty}</p>`; return; }
  box.innerHTML = games.map(g => {
    const accent = /^#[0-9a-f]{6}$/i.test(g.accent || "") ? g.accent : "#f2f1ed";
    const path = safeUrl(g.path || (g.id + "/")) || "#";
    const prev = g.preview ? safeUrl(/^(https:|data:)/.test(g.preview) ? g.preview : path + g.preview) : "";
    const initials = esc((txt(g.name) || "?").slice(0, 2).toUpperCase());
    const art = prev
      ? `<img src="${esc(prev)}" alt="" loading="lazy" data-initials="${initials}">`
      : `<div class="mono">${initials}</div>`;
    const tags = [];
    (g.languages || []).forEach(l => tags.push(esc(String(l).toUpperCase())));
    if (g.daily) tags.push(T[lang].daily);
    (g.tags || []).forEach(t => tags.push(esc(txt(t))));
    return `<a class="card" href="${esc(path)}" style="--accent:${accent};--accent-fg:${fgFor(accent)}">
      <div class="art">${art}</div>
      <div class="body">
        <h2><i></i>${esc(txt(g.name))}</h2>
        <p>${esc(txt(g.description))}</p>
        <div class="meta">${tags.map(t => `<span>${t}</span>`).join("")}</div>
        <span class="play">${T[lang].play}</span>
      </div></a>`;
  }).join("");
  box.querySelectorAll("img[data-initials]").forEach(img => img.addEventListener("error", () => {
    const d = document.createElement("div"); d.className = "mono"; d.textContent = img.dataset.initials; img.replaceWith(d);
  }));
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("hub:lang", lang); } catch(e){} render();
}));
render();
fetch("games.json", { cache:"no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(list => { games = Array.isArray(list) ? list.filter(g => g && !g.hidden) : []; render(); })
  .catch(() => { games = false; render(); });
</script>
</body>
</html>
